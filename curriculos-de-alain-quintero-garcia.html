<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>Currículos de Alain Quintero García</title>
    <style>
      :root {
        --bg: #f4f1ec;
        --surface: #ffffff;
        --ink: #1c1a17;
        --muted: #5d574e;
        --line: #ddd5c8;
        --gta: #e8547c;
        --rdr: #a03423;
        --cyber: #b8860b;
        --shadow: 0 2px 10px rgba(28, 26, 23, 0.08);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #14120f;
          --surface: #201d19;
          --ink: #f0ebe3;
          --muted: #b3a99b;
          --line: #3a352e;
          --gta: #ff7d9c;
          --rdr: #e0705a;
          --cyber: #f5c518;
          --shadow: 0 2px 12px rgba(0, 0, 0, 0.45);
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: Georgia, "Times New Roman", serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        max-width: 560px;
        margin: 0 auto;
        padding: 56px 20px 64px;
      }
      h1 {
        font-size: clamp(1.9rem, 6vw, 2.6rem);
        line-height: 1.15;
        margin: 0 0 10px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      .intro {
        font-size: 1.05rem;
        line-height: 1.55;
        color: var(--muted);
        margin: 0 0 36px;
      }
      nav { display: flex; flex-direction: column; gap: 14px; }
      a.cv {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        min-height: 64px;
        padding: 18px 20px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 10px;
        box-shadow: var(--shadow);
        text-decoration: none;
        color: var(--ink);
        transition: transform 0.15s ease, border-color 0.15s ease;
      }
      a.cv:hover, a.cv:focus-visible {
        transform: translateY(-2px);
        outline: none;
      }
      a.cv .phrase {
        font-size: 1.2rem;
        font-weight: 700;
        text-decoration: underline;
        text-underline-offset: 4px;
        text-decoration-thickness: 2px;
      }
      a.cv .arrow {
        font-family: system-ui, sans-serif;
        font-size: 1.3rem;
        flex: none;
      }
      a.cv.gta .phrase, a.cv.gta .arrow { color: var(--gta); }
      a.cv.gta:hover, a.cv.gta:focus-visible { border-color: var(--gta); }
      a.cv.rdr .phrase, a.cv.rdr .arrow { color: var(--rdr); }
      a.cv.rdr:hover, a.cv.rdr:focus-visible { border-color: var(--rdr); }
      a.cv.cyber .phrase, a.cv.cyber .arrow { color: var(--cyber); }
      a.cv.cyber:hover, a.cv.cyber:focus-visible { border-color: var(--cyber); }
      @media (prefers-reduced-motion: reduce) {
        a.cv { transition: none; }
        a.cv:hover { transform: none; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Alain Quintero García</h1>
      <p class="intro">Mi currículo en tres versiones interactivas. Toca la que quieras ver:</p>
      <nav aria-label="Versiones del currículo">
        <a class="cv gta" href="https://tinyurl.com/2ypcpw3p" target="_blank" rel="noopener">
          <span class="phrase">Currículum GTA 6</span>
          <span class="arrow" aria-hidden="true">→</span>
        </a>
        <a class="cv rdr" href="https://tinyurl.com/2dbzre8x" target="_blank" rel="noopener">
          <span class="phrase">Currículum Red Dead Redemption 2</span>
          <span class="arrow" aria-hidden="true">→</span>
        </a>
        <a class="cv cyber" href="https://tinyurl.com/2yv5pf4a" target="_blank" rel="noopener">
          <span class="phrase">Currículum Cyberpunk</span>
          <span class="arrow" aria-hidden="true">→</span>
        </a>
      </nav>
    </main>
  </body>
</html>
